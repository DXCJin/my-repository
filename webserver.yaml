AWSTemplateFormatVersion: '2010-09-09'
Description: Web server using existing VPC/subnets. SSM Session Manager access via internet (no VPC endpoints needed).

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair (kept for emergency use)
    Default: jinshuoji@keypair

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC ID
    Default: vpc-097b82126e0f90dab

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet (must have route to Internet Gateway so SSM agent can reach AWS endpoints)
    Default: subnet-0e3acaf5108088fc1

Resources:
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP inbound; SSM outbound handled by default egress rule
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: WebServerSG

  # IAM Role allowing EC2 to register with SSM (no VPC endpoint required when instance has public IP)
  SSMInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: WebServerSSMRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  SSMInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: WebServerSSMProfile
      Roles:
        - !Ref SSMInstanceRole

  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnetId
      # Public IP is required for SSM to work without VPC endpoints
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          SubnetId: !Ref PublicSubnetId
          GroupSet:
            - !Ref WebServerSecurityGroup
      IamInstanceProfile: !Ref SSMInstanceProfile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf update -y
          dnf install -y httpd
          systemctl enable httpd
          systemctl start httpd
          systemctl enable amazon-ssm-agent
          systemctl start amazon-ssm-agent
          cat > /var/www/html/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>Hello World</title></head>
          <body style="font-family:Arial;text-align:center;margin-top:100px;">
            <h1>Hello World!</h1>
            <p>Deployed via AWS CloudFormation</p>
          </body>
          </html>
          EOF
      Tags:
        - Key: Name
          Value: WebServerEC2

Outputs:
  InstanceId:
    Description: Instance ID — use this to start SSM Session Manager in the console
    Value: !Ref WebServerInstance

  PublicIP:
    Description: Public IP address of the EC2 instance
    Value: !GetAtt WebServerInstance.PublicIp

  WebURL:
    Description: Hello World page URL
    Value: !Sub 'http://${WebServerInstance.PublicIp}'
